[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-align"
version = "1.0.0"
description = "Joint retention-time alignment of GC-MS chromatograms across many batches"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesse Wood" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    # Not on PyPI: a direct reference, pinned to a pushed commit of github.com/woodRock/warp-align.
    # Bump it when this package should follow a gcmsalign change. To develop against a local
    # checkout instead, install it editable and this package with --no-deps (see the README).
    "gcmsalign @ git+https://github.com/woodRock/warp-align.git@1ffaa24a44dde64dca41c958fe2fefd0725aec84",
]

[project.optional-dependencies]
neural = ["torch>=2.1"]                # jointalign.neural_joint, scripts 31 and 32
dev = ["pytest>=8", "coverage>=7", "ruff", "mypy", "matplotlib>=3.7"]
tutorial = ["jupyter", "ipywidgets"]

[project.urls]
Repository = "https://github.com/woodRock/joint-align"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end runs of the numbered scripts on synthetic data (deselect with -m \"not slow\")",
]
filterwarnings = [
    "ignore:enable_nested_tensor is True:UserWarning",
]

[tool.coverage.run]
source = ["jointalign", "scripts"]
omit = ["scripts/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
# Same families as gcmsalign; bug-catching rules on, pure style rules that clash with this
# code's idiom (hand-aligned assignments, `say = lambda …` helpers) off.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E702",     # short `a = …; b = …` statements
    "E731",     # small named lambdas (say, fit, short)
    "E741",     # 'l' as a name in short comprehensions
    "B905",     # zip() without strict=
    "C408",     # dict(...) calls
    "RUF001",   # ×, −, σ, τ etc. in strings and comments are intended
    "RUF002",
    "RUF003",
    "RUF005",   # list concatenation
    "SIM300",   # comparisons against UPPER_CASE arrays (TIME_AXIS < x) are not Yoda conditions
]

[tool.ruff.lint.per-file-ignores]
# The teaching notebook imports each tool where it is first explained, and prints long lines.
"tutorial/*.ipynb" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["jointalign", "conftest", "analysis"]
known-third-party = ["gcmsalign"]

[tool.mypy]
python_version = "3.11"
files = ["src/jointalign"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
