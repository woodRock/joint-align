# Tool configuration only: this repo is scripts + src/, not an installable package.
# Dependencies: requirements.txt (gcmsalign pinned for CI; locally `pip install -e ~/Desktop/alignment`).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end runs of the numbered scripts on synthetic data (deselect with -m \"not slow\")",
]
filterwarnings = [
    "ignore:enable_nested_tensor is True:UserWarning",
]

[tool.coverage.run]
source = ["src", "scripts"]
omit = ["scripts/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
# Same families as gcmsalign; bug-catching rules on, pure style rules that clash with this
# code's idiom (hand-aligned assignments, `say = lambda …` helpers) off.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E402",     # scripts put src/ on sys.path before local imports
    "E702",     # short `a = …; b = …` statements
    "E731",     # small named lambdas (say, fit, short)
    "E741",     # 'l' as a name in short comprehensions
    "B905",     # zip() without strict=
    "C408",     # dict(...) calls
    "RUF001",   # ×, −, σ, τ etc. in strings and comments are intended
    "RUF002",
    "RUF003",
    "RUF005",   # list concatenation
    "SIM300",   # comparisons against UPPER_CASE arrays (TIME_AXIS < x) are not Yoda conditions
]

[tool.ruff.lint.per-file-ignores]
# The teaching notebook imports each tool where it is first explained, and prints long lines.
"tutorial/*.ipynb" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["multibatch", "neural_joint", "provenance", "conftest"]
known-third-party = ["gcmsalign"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
