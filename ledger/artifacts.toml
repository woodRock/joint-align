# What each paper artifact is built from. Outputs land in ~/overleaf/joint-align/generated/.
# Results come from scripts/export_ledger.py (scripts 01, 03 and 04). Keys: \res{ticr-joint/sep2015-jul2016/mean}.

[artifacts.results]
kind = "macros"
output = "generated/results.tex"
results = ["*"]                    # every result in ledger/results/

# Table II (tab:ticr). Caption, label, \tablefont, \tabcolsep and the footnote stay in TAI_template.tex.
[artifacts.table_ticr]
kind = "table"
output = "generated/table_ticr.tex"
script = "artifacts/table_ticr.py"
results = ["pairs", "ticr-dense-pchip", "ticr-joint", "ticr-joint-cf", "ticr-pairwise",
           "ticr-pooled-pchip", "ticr-unaligned"]
rules = "hline"
colspec = "@{}lrrrrrrr@{}"
bold = "max"
bold_by = "row"                    # best in-sample method per row (Anchors and Joint-CF excluded)
group_align = "@{}l"

[format.default]
decimals = 3

# How the paper prints each kind of number (checked by `taura check`: adopt-mismatch).
[format."anchors/*"]
thousands = true

[format."*/*/anchors"]
thousands = true

[format."*/all/holm-p-max"]        # p-value bounds: p \le 2\times10^{-3}, rounded up so they stay true
sci = true
decimals = 0
round = "up"

[format."*/all/p-max"]
sci = true
decimals = 0
round = "up"

[format."coverage/*"]
percent = true
decimals = 0

[format."rejection/*"]
percent = true
decimals = 1

[format."rejection/*/*"]
percent = true
decimals = 1

[format."recovery/real-pair/rejected"]
percent = true
decimals = 1

[format."drift/*/*"]               # minutes
decimals = 1

[format."band/*/spearman"]
decimals = 2

[format."bench-native-*/drifted4/*"]
decimals = 2

[format."bench-wilcoxon-*/all/delta-*"]
decimals = 2

[format."wilcoxon-joint-vs-pooled-pchip/all/delta-*"]
decimals = 2

[format."cycle/joint/max"]         # numerical: 0.0023
decimals = 4
