[artifacts.fig5_borrowing]
kind = "figure"
output = "generated/fig5_borrowing.pdf"
source = "figs/paper/fig5_borrowing.pdf"
made_by = "scripts/04_paper_figures.py"

[artifacts.fig6_benchmark]
kind = "figure"
output = "generated/fig6_benchmark.pdf"
source = "figs/paper/fig6_benchmark.pdf"
made_by = "scripts/04_paper_figures.py"

[artifacts.figS1_lambda]
kind = "figure"
output = "generated/figS1_lambda.pdf"
source = "figs/paper/figS1_lambda.pdf"
