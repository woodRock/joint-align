# What each paper artifact is built from. Outputs land in ~/overleaf/joint-align/generated/.
# Results come from scripts/export_ledger.py (scripts 01, 03 and 04). Keys: \res{ticr-joint/sep2015-jul2016/mean}.

[artifacts.results]
kind = "macros"
output = "generated/results.tex"
results = ["*"]                    # every result in ledger/results/

# Table II (tab:ticr). Caption, label, \tablefont, \tabcolsep and the footnote stay in TAI_template.tex.
[artifacts.table_ticr]
kind = "table"
output = "generated/table_ticr.tex"
script = "artifacts/table_ticr.py"
results = ["pairs", "ticr-dense-pchip", "ticr-joint", "ticr-joint-cf", "ticr-pairwise",
           "ticr-pooled-pchip", "ticr-unaligned"]
rules = "hline"
colspec = "@{}lrrrrrrr@{}"
bold = "max"
bold_by = "row"                    # best in-sample method per row (Anchors and Joint-CF excluded)
group_align = "@{}l"

[format.default]
decimals = 3

# Figures: written by script 04 (figs/paper/, gitignored there); compared by content, not bytes.
[artifacts.fig1_problem_method]
kind = "figure"
output = "generated/fig1_problem_method.pdf"
source = "figs/paper/fig1_problem_method.pdf"
made_by = "scripts/04_paper_figures.py"

[artifacts.fig2_recovery]
kind = "figure"
output = "generated/fig2_recovery.pdf"
source = "figs/paper/fig2_recovery.pdf"
made_by = "scripts/04_paper_figures.py"

[artifacts.fig3_comparison]
kind = "figure"
output = "generated/fig3_comparison.pdf"
source = "figs/paper/fig3_comparison.pdf"
made_by = "scripts/04_paper_figures.py"

[artifacts.fig4_consistency]
kind = "figure"
output = "generated/fig4_consistency.pdf"
source = "figs/paper/fig4_consistency.pdf"
