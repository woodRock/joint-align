name: CI

# Every push and pull request: lint, type-check, and the whole test suite (unit + synthetic
# end-to-end, ~1 min) against the alignbench commit pinned in pyproject.toml. The private
# fish-oil data is not available here, so tests/test_real_data.py skips itself.
#
# Upstream canary: the same tests against alignbench's latest main (weekly, on demand, and on
# every push). It is non-blocking: a failure means bumping the pin will need changes here.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'  # Mondays 04:00 UTC: canary against alignbench main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  TORCH_VERSION: '2.7.1'  # CPU wheels for the neural joint (jointalign[neural])
  TORCH_INDEX: https://download.pytorch.org/whl/cpu  # CPU wheels: no CUDA download
  RUFF_VERSION: '0.17.0'
  MYPY_VERSION: '2.4.0'

jobs:
  lint:
    name: Lint (ruff)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==$RUFF_VERSION
      - run: ruff check --output-format=github .

  types:
    name: Types (mypy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch==$TORCH_VERSION --index-url $TORCH_INDEX
      - run: pip install -e ".[dev,neural]" mypy==$MYPY_VERSION
      - run: mypy

  tests:
    name: Tests (pinned alignbench)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch==$TORCH_VERSION --index-url $TORCH_INDEX
      - run: pip install -e ".[dev,neural,wt]"  # wt: warpalign, for script 31
      - name: Record alignbench revision
        run: python -c "import importlib.metadata as m; print(m.distribution('alignbench').read_text('direct_url.json'))"
      - name: Run tests with coverage
        run: python -m coverage run -m pytest --junitxml=junit.xml
      - name: Coverage report (fails under the threshold in pyproject.toml)
        if: always()
        run: |
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: junit.xml

  alignbench-main:
    name: Canary (alignbench main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch==$TORCH_VERSION --index-url $TORCH_INDEX
      - run: pip install -e ".[dev,neural,wt]"  # wt: warpalign, for script 31
      - run: pip install --force-reinstall --no-deps "alignbench @ git+https://github.com/woodRock/align-bench.git@main"
      - run: python -m pytest

  package:
    name: Package (non-editable install)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # A clean venv and a regular (non-editable) install, imported from outside the checkout:
      # catches modules or data missing from the built package.
      - run: python -m venv /tmp/venv
      - run: /tmp/venv/bin/pip install torch==$TORCH_VERSION --index-url $TORCH_INDEX
      - run: /tmp/venv/bin/pip install ".[neural]"
      - name: Import from outside the repository
        working-directory: /tmp
        run: |
          /tmp/venv/bin/python -c "import jointalign; print(jointalign.__version__)"
          /tmp/venv/bin/python -c "import jointalign.neural_joint, jointalign.synthetic"
          /tmp/venv/bin/python -c "from jointalign.provenance import jointalign_revision as r; print(r()); assert r().endswith('(installed, no git)')"
